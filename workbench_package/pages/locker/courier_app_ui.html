<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物业管理APP - UI原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 
         * 设计规范:
         * 1. 色彩哲学 (亮色布局):
         *    - 主背景色 (Dominant 60%): hsl(220, 25%, 97%) - 非常浅的冷灰色，提供宁静、干净的基底。
         *    - 支撑色 (Support 30%): hsl(0, 0%, 100%) - 纯白，用于卡片和突出区域，增强层次感。
         *    - 强调色 (Accent 10%): hsl(210, 90%, 65%) - 柔和而充满活力的蓝色，用于按钮、图标和关键操作。
         *    - 主文字色: hsl(220, 25%, 25%) - 深灰色，保证优良的可读性。
         *    - 次要文字色: hsl(220, 15%, 55%) - 中灰色，用于辅助信息和标签。
         * 2. 字体排印:
         *    - 标题/展示字体: 'Space Grotesk', sans-serif - 具有科技感和现代感的无衬线体。
         *    - 正文/UI字体: 'Poppins', sans-serif - 几何感强，友好且清晰。
         */

        :root {
            /* 色彩 */
            --color-bg-dominant: hsl(220, 25%, 97%);
            --color-bg-support: hsl(0, 0%, 100%);
            --color-accent: hsl(210, 90%, 65%);
            --color-accent-dark: hsl(210, 90%, 55%);
            --color-text-primary: hsl(220, 25%, 25%);
            --color-text-secondary: hsl(220, 15%, 55%);
            --color-border: hsl(220, 20%, 90%);
            --color-success: hsl(140, 60%, 55%);
            --color-danger: hsl(0, 70%, 60%);

            /* 字体 */
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Poppins', sans-serif;
        }

        body {
            background-color: #E5E7EB; /* A neutral gray for the outside area */
            font-family: var(--font-body);
            color: var(--color-text-primary);
            padding: 2rem;
        }

        .preview-container {
            display: flex;
            justify-content: center;
            min-height: 850px;
        }

        .phone-screen {
            width: 375px;
            height: 812px;
            background-color: var(--color-bg-dominant);
            border: 1px solid #CCC;
            border-radius: 40px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2);
            display: none; /* Hidden by default for SPA feel */
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .phone-screen.active {
            display: flex;
        }
        
        .page-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 2rem; /* 32px */
            line-height: 2.5rem; /* 40px */
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px 8px;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
            color: var(--color-text-secondary);
        }
        
        .status-bar .time {
            font-family: var(--font-body);
        }

        .status-bar .icons i {
            margin-left: 6px;
        }

        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0 1.5rem; /* 24px */
        }
        
        /* Hide scrollbar */
        .main-content::-webkit-scrollbar {
            display: none;
        }
        .main-content {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Form Styles */
        .spec-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem; /* 12px */
        }

        .spec-grid input {
            display: none;
        }

        .spec-card {
            display: block;
            background-color: var(--color-bg-support);
            border: 1px solid hsl(220, 20%, 92%);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .spec-grid input:checked + .spec-card {
            background-color: hsl(210, 100%, 96%);
            border-color: var(--color-accent);
            color: var(--color-accent);
        }
        
        .spec-container {
             display: flex;
             flex-direction: row;
             gap: 10px;
        }
        .spec-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .spec-item input {
            display: none;
        }
        .spec-label {
            display: block;
            background-color: var(--color-bg-support);
            border: 1px solid hsl(220, 20%, 92%);
            border-radius: 10px;
            padding: 0.75rem 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            color: var(--color-text-primary);
            width: 100%;
        }
        .spec-item input:checked + .spec-label {
            background-color: hsl(210, 100%, 96%);
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-size: 0.875rem; /* 14px */
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-input {
            width: 100%;
            background-color: var(--color-bg-support);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            color: var(--color-text-primary);
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px hsla(210, 90%, 65%, 0.2);
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon .form-input {
            padding-right: 3rem;
        }
        
        .input-icon {
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            color: var(--color-text-secondary);
            font-size: 1.25rem;
        }

        .segmented-control {
            display: flex;
            width: 100%;
            background-color: var(--color-bg-dominant);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--color-border);
        }

        .segmented-control input {
            display: none;
        }

        .segmented-control label {
            flex: 1;
            text-align: center;
            padding: 0.625rem 0;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            color: var(--color-text-secondary);
            transition: all 0.3s ease;
        }

        .segmented-control input:checked + label {
            background-color: var(--color-bg-support);
            color: var(--color-accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 1rem;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .btn-primary {
            background-color: var(--color-accent);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--color-accent-dark);
        }
        
        .btn-secondary {
            background-color: var(--color-bg-support);
            color: var(--color-accent);
            border: 1px solid var(--color-border);
        }
        
        .btn-ghost {
            background-color: transparent;
            color: var(--color-text-secondary);
        }
        
        /* Animation */
        @keyframes reveal {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        .reveal {
            animation: reveal 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Hover Card Effect */
        .hover-card:hover {
            transform: scale(1.02);
        }
        .hover-card {
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="preview-container">

        <!-- Screen 1: Home / Menu -->
        <div id="screen-home" class="phone-screen active">
            <div class="status-bar">
                <span class="time">9:41</span>
                <span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
            </div>
            <div class="main-content pt-6 pb-8">
                <h1 class="page-title mb-2">智能快递柜</h1>
                <p class="text-base mb-10" style="color: var(--color-text-secondary);">欢迎您，王师傅！</p>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Courier Deposit -->
                    <div class="reveal col-span-2" style="animation-delay: 0.1s;">
                        <a onclick="showScreen('screen-deposit')" class="block p-6 rounded-2xl text-white cursor-pointer hover-card" style="background: linear-gradient(135deg, #4A90E2 0%, #50E3C2 100%);">
                            <i class="fa-solid fa-box-taped text-3xl mb-4 opacity-70"></i>
                            <h2 class="font-bold text-xl font-sans">快递员存件</h2>
                            <p class="text-sm opacity-80 mt-1">为小区住户存入包裹</p>
                        </a>
                    </div>
                    
                    <!-- Temp Storage -->
                    <div class="reveal col-span-2" style="animation-delay: 0.2s;">
                        <a onclick="showScreen('screen-temp')" class="block p-6 rounded-2xl text-white cursor-pointer hover-card" style="background: linear-gradient(135deg, #F5A623 0%, #F8E71C 100%);">
                            <i class="fa-solid fa-boxes-packing text-3xl mb-4 opacity-70"></i>
                            <h2 class="font-bold text-xl font-sans">临时存货</h2>
                            <p class="text-sm opacity-80 mt-1">临时存放个人物品</p>
                        </a>
                    </div>

                    <!-- Pickup -->
                    <div class="reveal" style="animation-delay: 0.3s;">
                        <a onclick="showScreen('screen-pickup')" class="block p-5 rounded-2xl text-white h-full cursor-pointer hover-card" style="background: linear-gradient(135deg, #9F44D3 0%, #E233FF 100%);">
                            <i class="fa-solid fa-box-archive text-2xl mb-3 opacity-70"></i>
                            <h2 class="font-bold text-lg font-sans">包裹取件</h2>
                            <p class="text-xs opacity-80 mt-1">输入取件码</p>
                        </a>
                    </div>

                    <!-- Records -->
                    <div class="reveal" style="animation-delay: 0.4s;">
                        <a onclick="showScreen('screen-records')" class="block p-5 rounded-2xl text-white h-full cursor-pointer hover-card" style="background: linear-gradient(135deg, #5B6C8F 0%, #8A9CBF 100%);">
                            <i class="fa-solid fa-list-check text-2xl mb-3 opacity-70"></i>
                            <h2 class="font-bold text-lg font-sans">存取记录</h2>
                            <p class="text-xs opacity-80 mt-1">查看历史记录</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Screen 2: Courier Deposit -->
        <div id="screen-deposit" class="phone-screen">
            <div class="status-bar">
                <span class="time">9:42</span>
                <span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
            </div>
            <header class="flex items-center p-4">
                <i onclick="showScreen('screen-home')" class="fa-solid fa-chevron-left text-xl w-8 cursor-pointer hover:text-gray-800" style="color: var(--color-text-secondary);"></i>
                <h2 class="text-lg font-bold text-center flex-1" style="font-family: var(--font-display);">快递员存件</h2>
                <div class="w-8"></div>
            </header>
            <div class="main-content pt-4">
                <form onsubmit="event.preventDefault(); showScreen('screen-success');">
                    <div class="form-group">
                        <label class="form-label" for="locker-select">快递柜</label>
                        <select id="locker-select" class="form-input">
                            <option>幸福里小区 A栋-01号柜</option>
                            <option>幸福里小区 B栋-02号柜</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">柜格型号</label>
                        <div class="spec-grid">
                            <div>
                                <input type="radio" name="size" id="size-s" value="s" checked>
                                <label for="size-s" class="spec-card">小号</label>
                            </div>
                            <div>
                                <input type="radio" name="size" id="size-m" value="m">
                                <label for="size-m" class="spec-card">中号</label>
                            </div>
                            <div>
                                <input type="radio" name="size" id="size-l" value="l">
                                <label for="size-l" class="spec-card">大号</label>
                            </div>
                            <div>
                                <input type="radio" name="size" id="size-xl" value="xl">
                                <label for="size-xl" class="spec-card">超大号</label>
                            </div>
                            <div>
                                <input type="radio" name="size" id="size-doc" value="doc">
                                <label for="size-doc" class="spec-card">文件柜</label>
                            </div>
                            <div>
                                <input type="radio" name="size" id="size-fresh" value="fresh">
                                <label for="size-fresh" class="spec-card">生鲜柜</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="tracking-number">快递单号</label>
                        <div class="input-with-icon">
                            <input type="text" id="tracking-number" class="form-input" placeholder="输入或扫描单号">
                            <i class="input-icon fa-solid fa-barcode"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="customer-phone">客户手机</label>
                        <input type="tel" id="customer-phone" class="form-input" placeholder="输入收件人手机号">
                    </div>
                    <div class="mt-8">
                        <button class="btn btn-primary">开始存货</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Screen 3: Temporary Storage -->
        <div id="screen-temp" class="phone-screen">
            <div class="status-bar">
                <span class="time">9:43</span>
                <span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
            </div>
            <header class="flex items-center p-4">
                <i onclick="showScreen('screen-home')" class="fa-solid fa-chevron-left text-xl w-8 cursor-pointer hover:text-gray-800" style="color: var(--color-text-secondary);"></i>
                <h2 class="text-lg font-bold text-center flex-1" style="font-family: var(--font-display);">临时存货</h2>
                <div class="w-8"></div>
            </header>
            <div class="main-content pt-4">
                <form onsubmit="event.preventDefault(); showScreen('screen-success');">
                    <div class="form-group">
                        <label class="form-label" for="temp-locker-select">快递柜</label>
                        <select id="temp-locker-select" class="form-input">
                            <option>幸福里小区 A栋-01号柜</option>
                            <option>幸福里小区 B栋-02号柜</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">柜格型号</label>
                        <div class="spec-container">
                            <div class="spec-column">
                                <div class="spec-item">
                                    <input type="radio" name="temp-size" id="temp-size-s" value="s" checked>
                                    <label for="temp-size-s" class="spec-label">小号</label>
                                </div>
                                <div class="spec-item">
                                    <input type="radio" name="temp-size" id="temp-size-xl" value="xl">
                                    <label for="temp-size-xl" class="spec-label">超大号</label>
                                </div>
                            </div>
                            <div class="spec-column">
                                <div class="spec-item">
                                    <input type="radio" name="temp-size" id="temp-size-m" value="m">
                                    <label for="temp-size-m" class="spec-label">中号</label>
                                </div>
                                <div class="spec-item">
                                    <input type="radio" name="temp-size" id="temp-size-doc" value="doc">
                                    <label for="temp-size-doc" class="spec-label">文件柜</label>
                                </div>
                            </div>
                            <div class="spec-column">
                                <div class="spec-item">
                                    <input type="radio" name="temp-size" id="temp-size-l" value="l">
                                    <label for="temp-size-l" class="spec-label">大号</label>
                                </div>
                                <div class="spec-item">
                                    <input type="radio" name="temp-size" id="temp-size-fresh" value="fresh">
                                    <label for="temp-size-fresh" class="spec-label">生鲜柜</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="storage-hours">存货时长 (小时)</label>
                        <input type="number" id="storage-hours" class="form-input" placeholder="输入整数小时" value="1">
                    </div>
                    <div class="mt-6 p-4 rounded-lg text-center" style="background-color: hsl(210, 90%, 95%); color: var(--color-accent-dark);">
                        <p class="font-bold">费用: ¥2.00</p>
                        <p class="text-xs">小号柜 2元/小时</p>
                    </div>
                    <div class="mt-8">
                        <button class="btn btn-primary">开始存货并支付</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Screen 4: Deposit Confirmation (Result) -->
        <div id="screen-success" class="phone-screen flex flex-col justify-center items-center p-8 text-center bg-gray-800 text-white">
            <div class="reveal">
                <i class="fa-solid fa-door-open text-7xl mb-6" style="color: var(--color-accent);"></i>
            </div>
            <h1 class="text-3xl font-bold mb-3 reveal" style="animation-delay: 0.1s;">柜门已打开</h1>
            <p class="text-lg opacity-80 mb-10 reveal" style="animation-delay: 0.2s;">请尽快存入物品</p>
            
            <div class="relative w-32 h-32 flex items-center justify-center mb-12 reveal" style="animation-delay: 0.3s;">
                <svg class="absolute w-full h-full" viewbox="0 0 100 100">
                    <circle class="text-gray-600" stroke-width="8" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50"/>
                    <circle class="text-green-400" stroke-width="8" stroke-linecap="round" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" style="stroke-dasharray: 283; stroke-dashoffset: 28.3; animation: countdown 20s linear forwards;"/>
                </svg>
                <span class="text-4xl font-bold">18</span>
            </div>
            
            <div class="w-full space-y-4 reveal" style="animation-delay: 0.4s;">
                <button onclick="showScreen('screen-home')" class="btn" style="background-color: var(--color-success); color: white;">存货成功 (返回首页)</button>
                <button onclick="showScreen('screen-home')" class="btn btn-ghost">取消存货</button>
            </div>
            <style> @keyframes countdown { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 283; } } </style>
        </div>

        <!-- Screen 5: Pickup -->
        <div id="screen-pickup" class="phone-screen">
            <div class="status-bar">
                <span class="time">9:45</span>
                <span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
            </div>
            <header class="flex items-center p-4">
                <i onclick="showScreen('screen-home')" class="fa-solid fa-chevron-left text-xl w-8 cursor-pointer hover:text-gray-800" style="color: var(--color-text-secondary);"></i>
                <h2 class="text-lg font-bold text-center flex-1" style="font-family: var(--font-display);">包裹取件</h2>
                <div class="w-8"></div>
            </header>
            <div class="main-content flex flex-col justify-center items-center text-center px-8">
                <i class="fa-solid fa-box-archive text-6xl mb-6" style="color: var(--color-accent);"></i>
                <h1 class="text-2xl font-bold mb-3">请输入取件码</h1>
                <p class="mb-8" style="color: var(--color-text-secondary);">输入取件码或快递单号以打开柜门</p>
                <div class="form-group w-full">
                    <input type="text" class="form-input text-center text-2xl tracking-[0.5em]" placeholder="••••••">
                </div>
                <div class="w-full mt-2">
                    <button class="btn btn-primary" onclick="showScreen('screen-success')">确认取件</button>
                </div>
            </div>
        </div>

        <!-- Screen 6: Storage Records -->
        <div id="screen-records" class="phone-screen">
            <div class="status-bar">
                <span class="time">9:46</span>
                <span class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
            </div>
            <header class="flex items-center p-4">
                <i onclick="showScreen('screen-home')" class="fa-solid fa-chevron-left text-xl w-8 cursor-pointer hover:text-gray-800" style="color: var(--color-text-secondary);"></i>
                <h2 class="text-lg font-bold text-center flex-1" style="font-family: var(--font-display);">存取记录</h2>
                <div class="w-8"></div>
            </header>
            <div class="px-6 pb-4">
                <div class="segmented-control">
                    <input type="radio" name="record-type" id="record-courier" value="courier" checked><label for="record-courier">快递存货</label>
                    <input type="radio" name="record-type" id="record-temp" value="temp"><label for="record-temp">临时存货</label>
                </div>
            </div>
            <div class="main-content pt-0 space-y-4">
                <!-- This content would dynamically change based on the selection -->
                <div class="p-4 rounded-xl flex items-center" style="background: var(--color-bg-support);">
                    <div class="w-12 h-12 rounded-lg flex items-center justify-center mr-4" style="background-color: hsl(210, 90%, 95%); color: var(--color-accent);">
                        <i class="fa-solid fa-box-taped text-2xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-bold">快递单号: ...7890</p>

    <script>
        function showScreen(screenId) {
            // Hide all screens
            const screens = document.querySelectorAll('.phone-screen');
            screens.forEach(screen => {
                screen.classList.remove('active');
            });
            
            // Show target screen
            const target = document.getElementById(screenId);
            if (target) {
                target.classList.add('active');
            }
        }
    </script>
