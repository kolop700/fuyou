# =====================================================================
# 福优智家 iOS 原生壳 —— GitHub Actions 云端打包
# =====================================================================
# 两种模式（运行前手动选择）：
#   simulator  —— 免签名，仅验证工程可编译（无需任何证书，随时可跑）
#   testflight —— 签名 Archive 并上传 TestFlight（需配好下方 Secrets）
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置的 Secrets：
#   APPLE_CERT_P12_BASE64       发布证书 .p12 的 base64
#   APPLE_CERT_PASSWORD         .p12 导出密码
#   MOBILE_PROVISION_BASE64     App Store 描述文件 .mobileprovision 的 base64
#   KEYCHAIN_PASSWORD           临时钥匙串密码（自定义一个即可）
#   ASC_API_KEY_ID              App Store Connect API 密钥 ID
#   ASC_ISSUER_ID               App Store Connect Issuer ID
#   ASC_API_KEY_P8_BASE64       .p8 私钥的 base64
#
# 用法：Actions → "iOS 打包（福优智家）" → Run workflow → 选模式 → 运行
# =====================================================================
name: iOS 打包（福优智家）

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '打包模式'
        type: choice
        required: true
        default: simulator
        options:
          - simulator
          - testflight

jobs:
  build:
    # XcodeGen 2.44+ 生成的工程为 objectVersion 77，需 Xcode 16+ 才能打开
    # macos-26 云机默认 Xcode 26.x，可直接读取该格式
    runs-on: macos-26

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: shell-ios
        run: xcodegen generate

      # Taku 广告/微信/支付宝经 CocoaPods 集成：必须 pod install 后以 .xcworkspace 构建
      # （macos 云机镜像自带 CocoaPods；首跑若报 cocoapods 缺失再补 brew install cocoapods 步骤）
      - name: CocoaPods 安装
        working-directory: shell-ios
        run: pod install --repo-update

      # ---------------- 模式一：模拟器编译验证（免签名） ----------------
      - name: 编译验证（Simulator，不签名）
        if: inputs.mode == 'simulator'
        working-directory: shell-ios
        run: |
          xcodebuild -workspace CloudGuard.xcworkspace -scheme CloudGuard \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build
          # 白屏防回归：模拟器包同样校验 WebApp/ 目录结构（免费模式即可发现问题）
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/CloudGuard.app"
          test -f "$APP/WebApp/index.html" || { echo "::error::Bundle 缺少 WebApp/index.html（资源被平铺，会白屏）"; ls "$APP" | head -50; exit 1; }
          echo "WebApp 结构 OK：$(find "$APP/WebApp" -type f | wc -l) 个文件"

      # ---------------- 模式二：签名打包并上传 TestFlight ----------------
      - name: 配置签名证书与描述文件
        if: inputs.mode == 'testflight'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          MOBILE_PROVISION_BASE64: ${{ secrets.MOBILE_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERT_P12_BASE64" | base64 -D > cert.p12
          echo "$MOBILE_PROVISION_BASE64" | base64 -D > profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # 新旧 Xcode 的描述文件目录都放一份，确保能识别
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp profile.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"

      - name: 解码 ASC API 密钥（.p8）
        if: inputs.mode == 'testflight'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: 生成 ExportOptions.plist
        if: inputs.mode == 'testflight'
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.yefiot.fuyou</key><string>9f798af1-e9bc-4c20-abfa-260b798d1ffa</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: 归档 Archive
        if: inputs.mode == 'testflight'
        working-directory: shell-ios
        run: |
          set -euo pipefail
          # 构建号沿用 project.yml 的 CURRENT_PROJECT_VERSION（发版手动 +1），不再用时间戳覆盖
          echo "本次构建号以 project.yml 为准"
          xcodebuild -workspace CloudGuard.xcworkspace -scheme CloudGuard \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CloudGuard.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="9f798af1-e9bc-4c20-abfa-260b798d1ffa" \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8" \
            archive

      # 【白屏防回归】校验 H5 产物以目录结构进入 .app（build 127 事故：XcodeGen 未写
      # type: folder 时资源被平铺到包根目录，壳内 WebApp/ 不存在 → 全 404 → 启动白屏）。
      # 编译成功不代表能渲染，此处直接检查归档产物内的关键文件，缺失立即失败终止上传。
      - name: 校验 Bundle 内 WebApp 目录结构（防白屏）
        if: inputs.mode == 'testflight'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/CloudGuard.xcarchive/Products/Applications/CloudGuard.app"
          test -f "$APP/WebApp/index.html" || { echo "::error::Bundle 缺少 WebApp/index.html（资源被平铺，会白屏）"; ls "$APP" | head -50; exit 1; }
          ENTRY=$(grep -o 'assets/index-[^"]*\.js' "$APP/WebApp/index.html" | head -1)
          test -n "$ENTRY" && test -f "$APP/WebApp/$ENTRY" || { echo "::error::入口 JS $ENTRY 不在 Bundle WebApp/ 内"; exit 1; }
          echo "WebApp 结构 OK：$(find "$APP/WebApp" -type f | wc -l) 个文件，入口 $ENTRY"

      - name: 导出 ipa
        if: inputs.mode == 'testflight'
        working-directory: shell-ios
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CloudGuard.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ../ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8"

      - name: 保留 ipa 构建产物（Actions 页面可下载）
        if: inputs.mode == 'testflight'
        uses: actions/upload-artifact@v4
        with:
          name: fuyou-ios
          path: ${{ runner.temp }}/ipa/*.ipa

      # 上传前诊断：run 31/32 两次在 altool 报 "Cannot determine the Apple ID from
      # Bundle ID 'com.yefiot.fuyou'"（排查 key 失效 / bundle 解析 / app 状态，
      # 401=API Key 无效或被删；返回空数组=bundle 在该 key 团队下查不到；正常=altool 自身问题）
      - name: 诊断 ASC API（Key 与 Bundle ID 有效性）
        if: inputs.mode == 'testflight'
        # 诊断仅辅助定位，失败绝不阻塞后续上传（run 33/34 教训：诊断自身两度挂掉，白白跳过上传）
        continue-on-error: true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # macos 镜像的 Python 为 Homebrew 外部托管环境（PEP 668），系统 pip 安装直接被拦
          # （run 33 实锤），改用临时 venv 隔离安装依赖；ES256 签名需 cryptography（run 34 实锤）
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]'
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, time, os, sys
          import jwt, urllib.request, urllib.error
          kid = os.environ['ASC_API_KEY_ID']; iss = os.environ['ASC_ISSUER_ID']
          key = open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({'iss': iss, 'iat': int(time.time()), 'exp': int(time.time())+600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': kid})
          req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.yefiot.fuyou&fields%5Bapps%5D=name,bundleId', headers={'Authorization': f'Bearer {tok}'})
          try:
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              print('ASC_API_HTTP_ERROR', e.code, e.read().decode()[:800]); sys.exit(0)
          apps = data.get('data', [])
          print('ASC_API_OK apps_found=', len(apps))
          for a in apps:
              print('APP:', a['id'], a['attributes'])
          PY

      - name: 上传 TestFlight
        if: inputs.mode == 'testflight'
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          echo "上传：$IPA"
          # altool 上传（run 20 实测可用）；iTMSTransporter 已从新 Xcode 移除不可用（run 21 实锤）。
          # 旧版卡死真因是默认 360s step 超时，本步显式放宽到 25 分钟
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
          xcrun altool --upload-app  -f "$IPA" -t ios \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
        timeout-minutes: 25
